[project]
name = "openngs"
version = "0.0.0"
description = "An open standard for sample lineage in sequencing labs, plus a reference implementation."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2",
    "linkml-runtime>=1.8",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "typer>=0.13",
    "pg8000>=1.31",
    "jsonschema>=4.0",
    "fastmcp>=4.0.3",
    "strawberry-graphql[fastapi]>=0.327.4",
    "httpx>=0.28.1",
]

[project.scripts]
openngs = "openngs.cli:app"
openngs-mcp = "openngs.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openngs"]

[dependency-groups]
dev = [
    "linkml>=1.8",
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "types-jsonschema>=4.0",
    "httpx>=0.28.1",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["src/openngs/model/generated.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer's documented pattern is typer.Option(...)/typer.Argument(...) as the parameter
# default itself - that's exactly what B008 (no function calls in defaults) flags.
"src/openngs/cli.py" = ["B008"]

[tool.mypy]
strict = true
packages = ["openngs"]
mypy_path = "src"
exclude = ["^src/openngs/model/generated\\.py$"]

[[tool.mypy.overrides]]
module = "openngs.model.generated"
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "pg8000.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
